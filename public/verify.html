<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e1a"><title>تأكيد Gmail | AIM8</title><link rel="stylesheet" href="assets/style.css"></head><body data-page="recovery">
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-orb"><b>8</b></span><span class="brand-word">AIM<span>8</span></span></a><nav><a class="btn ghost small" href="auth.html">الرجوع لتسجيل الدخول</a></nav></div></header>
<main class="container"><div class="page-top" style="text-align:center"><span class="eyebrow">حماية AIM8</span><h1 id="recoveryTitle">استعادة كلمة المرور</h1><p>رمز تحقق مكوّن من 6 أرقام يصل إلى عنوان Gmail المسجل، صالح لمدة 10 دقائق.</p></div>
<div class="form-wrap"><div class="glass"><form id="recoveryForm">
<div class="form-group"><label for="recoveryEmail">بريد Gmail</label><input id="recoveryEmail" type="email" placeholder="example@gmail.com" required autocomplete="email"></div>
<button class="btn ghost full" type="button" id="sendRecovery">إرسال رمز الاستعادة</button>
<div id="recoveryCodeGroup" hidden><div class="form-group"><label for="recoveryCode">الرمز المرسل إلى Gmail</label><input id="recoveryCode" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required placeholder="000000"></div></div>
<div id="recoveryPassGroup" hidden><div class="form-group"><label for="recoveryPassword">كلمة المرور الجديدة</label><input type="password" id="recoveryPassword" minlength="10" placeholder="10 أحرف أو أكثر"></div><div class="form-group"><label for="recoveryConfirm">تأكيد كلمة المرور</label><input type="password" id="recoveryConfirm" minlength="10" placeholder="أعد كلمة المرور"></div></div>
<button class="btn full" id="recoverySubmit" type="submit">تأكيد الرمز والمتابعة</button><p id="recoveryResult" class="form-note" role="status"></p></form></div>
<div class="page-actions"><a class="btn ghost" href="auth.html">تسجيل الدخول</a><a class="btn dark" href="index.html">الرئيسية</a></div></div></main><div class="toast" id="toast" role="status"></div><script src="assets/main.js" defer></script></body></html>
